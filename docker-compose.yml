services:
  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/zabota
      - SPRING_DATASOURCE_USERNAME=zabota_user
      - SPRING_DATASOURCE_PASSWORD=changeme
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
    # ports и детали настройки будут добавлены позже

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    # ports и детали настройки будут добавлены позже

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=zabota
      - POSTGRES_USER=zabota_user
      - POSTGRES_PASSWORD=changeme
    volumes:
      - db_data:/var/lib/postgresql/data
    # ports и детали настройки будут добавлены позже

volumes:
  db_data:
