# Локальный стенд для проверки перед деплоем.
# ВНИМАНИЕ: Amvera docker-compose.yml НЕ поддерживает (только Dockerfile).
# Собирается ровно тот же корневой образ, что уедет в Amvera.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Перекрывает DB_URL из .env: локально БД живёт в контейнере db.
      # Формат строки повторяет amvera, отличается только хост.
      DB_URL: jdbc:postgresql://db:5432/zabota
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: zabota
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d zabota"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
